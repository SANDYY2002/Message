name: Verify Message
on:
  push:
    branches: [deployment, main]
  pull_request:
    branches: [deployment, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-root-password
          MYSQL_DATABASE: message_test
          MYSQL_USER: message_test
          MYSQL_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: message_test
      DB_PASSWORD: test-password
      DB_NAME: message_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-verification
          path: |
            test-results/
            playwright-report/
          retention-days: 7
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  production:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/init-production.mjs
      - run: docker compose config --quiet
      - run: docker compose build
      - run: docker compose up -d --wait app
      - run: docker compose exec -T app node --input-type=module < scripts/production-smoke.mjs
      - run: docker compose run --rm --no-deps proxy caddy validate --config /etc/caddy/Caddyfile
      - run: bash scripts/backup.sh
      - run: bash scripts/restore.sh "$(find backups -mindepth 1 -maxdepth 1 -type d | head -1)" --replace-data
      - run: docker compose exec -T -e SMOKE_RESTORE_CHECK=1 app node --input-type=module < scripts/production-smoke.mjs
      - if: failure()
        run: docker compose logs --tail=100
      - if: always()
        run: docker compose down
